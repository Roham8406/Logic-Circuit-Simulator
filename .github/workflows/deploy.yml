name: Deploy Simulator to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build the project
        run: npm run bundle 
        
      - name: Assemble website
        run: |
          mkdir deploy_target
          
          # Keep the "simulator" folder intact because the HTML expects assets to be inside it
          cp -r simulator deploy_target/
          
          # Generate index.html at the root and remove the placeholders
          sed -e 's/{{SUFFIX}}//g' -e 's/{{VERSION}}/1/g' simulator/html/index-template.html > deploy_target/index.html
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy_target'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
