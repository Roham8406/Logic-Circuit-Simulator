name: Deploy Simulator to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build the project
        run: npm run bundle 
        
      - name: Assemble website
        run: |
          mkdir deploy_target
          
          # Copy the core asset folders
          cp -r simulator/css deploy_target/
          cp -r simulator/img deploy_target/
          cp -r simulator/lib deploy_target/
          
          # The template expects the JS bundle and favicon in the same folder as index.html
          cp simulator/lib/bundle* deploy_target/ || true
          cp simulator/img/favicon.svg deploy_target/ || true
          
          # Convert the template into the final index.html and remove the {{SUFFIX}} placeholder
          sed 's/{{SUFFIX}}//g' simulator/html/index-template.html > deploy_target/index.html
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy_target'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
